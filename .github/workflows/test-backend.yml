name: Backend tests

# Called by main.yml for main/develop pushes and pull requests targeting them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-backend:
    # The hosted Docker daemon runs PostgreSQL through Testcontainers.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      # verify runs Surefire unit tests, Failsafe integration tests, and JaCoCo.
      - name: Build and test with Maven
        working-directory: simple-api
        run: mvn -B clean verify
