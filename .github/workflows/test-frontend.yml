name: Frontend tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The Vue app has no test suite; a successful production build is the check.
      - name: Build front image
        run: docker build -t front-test ./front

      - name: Build proxy image and validate Apache configuration
        run: |
          docker build -t httpd-test ./http-server
          docker run --rm httpd-test httpd -t

      - name: Verify Apache routes /api/ to the backend and / to the front
        run: |
          docker network create frontend-test
          # A mock backend isolates proxy behavior from Java and PostgreSQL.
          docker run -d --name simple-api --network frontend-test python:3.12-alpine \
            sh -c 'mkdir -p /tmp/www && echo api-ok > /tmp/www/index.html && python -m http.server 8080 --directory /tmp/www'
          docker run -d --name front --network frontend-test front-test
          docker run -d --name httpd-test --network frontend-test \
            -p 127.0.0.1:8080:80 httpd-test
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-all-errors --max-time 5 http://127.0.0.1:8080/api/ > /tmp/api-response
          grep -Fx 'api-ok' /tmp/api-response
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-all-errors --max-time 5 http://127.0.0.1:8080/ > /tmp/front-response
          grep -Eq 'id="?app"?' /tmp/front-response

      - name: Show logs and clean up containers
        if: always()
        run: |
          docker logs httpd-test || true
          docker logs simple-api || true
          docker logs front || true
          docker rm -f httpd-test simple-api front || true
          docker network rm frontend-test || true
