---
- name: Require Debian
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'

- name: Remove packages that conflict with Docker Engine
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-doc
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - python3-venv
    state: present
    update_cache: true

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Get Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_architecture
  changed_when: false

- name: Configure Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ docker_architecture.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  notify: Restart Docker

- name: Install Docker SDK for Python in a virtual environment
  ansible.builtin.pip:
    name: docker
    virtualenv: /opt/docker_venv
    virtualenv_command: python3 -m venv

- name: Ensure Docker is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: docker
